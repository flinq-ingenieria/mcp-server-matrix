[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-matrix"
version = "0.2.0"
description = "MCP server for Matrix — interact with Matrix homeservers via Model Context Protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ivan Ponomarev", email = "baho7726417@yandex.ru"},
]
keywords = ["mcp", "matrix", "matrix-nio", "synapse", "element", "chat", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "matrix-nio>=0.24.0",
    "markdown>=3.5",
]

[project.urls]
Homepage = "https://github.com/Baho73/mcp-server-matrix"
Repository = "https://github.com/Baho73/mcp-server-matrix"
Issues = "https://github.com/Baho73/mcp-server-matrix/issues"

[project.scripts]
mcp-server-matrix = "mcp_server_matrix.server:main"
